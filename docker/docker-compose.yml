# Built and run on 9 Nov 2026: the images build, all 13 migrations apply to an empty database, and the browser tests pass
# against it. Replace every "change-me" before real use.
services:
  db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: change-me-db-password, POSTGRES_DB: acctapp }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 10 }
  api:
    build: { context: .., dockerfile: docker/api.Dockerfile }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:change-me-db-password@db:5432/acctapp
      JWT_SECRET: change-me-to-a-random-string-of-at-least-32-chars
      BACKUP_KEY: change-me-backup-passphrase-keep-a-copy-offsite
      WEB_ORIGIN: http://localhost:8080
      TRUST_PROXY: "1"
      PAYMENT_PROVIDER: test   # replace with a real gateway before charging customers
      DATA_DIR: /var/acctapp/data
      BACKUP_DIR: /var/acctapp/backups
    volumes: [appdata:/var/acctapp]
    depends_on: { db: { condition: service_healthy } }
  web:
    build: { context: .., dockerfile: docker/web.Dockerfile }
    ports: ["8080:80"]
    depends_on: [api]
volumes:
  pgdata:
  appdata:

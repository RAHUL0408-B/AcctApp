# Render Blueprint (free plan): the API only. The web front end is deployed on Vercel (apps/web/vercel.json forwards /api here).
# The database is Supabase. You are asked for one value: DATABASE_URL (the Supabase session pooler string).
# Free-plan limits: the service sleeps after ~15 minutes without traffic (first request then takes ~50 seconds), the background worker only
# runs while it is awake, and there is no disk, so uploaded files and backups are wiped on every restart. Fine for a demo; use a paid plan
# with a disk (see docs/DEPLOY.md) before real client data goes in.
services:
  - type: web
    name: acctapp-api
    runtime: docker
    dockerfilePath: ./docker/api.Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false          # paste the Supabase session pooler connection string
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: BACKUP_KEY
        generateValue: true
      - key: WEB_ORIGIN
        value: https://acctapp.vercel.app   # change to your real Vercel address if it differs
      - key: TRUST_PROXY
        value: "1"
      - key: DATA_DIR
        value: /var/acctapp/data
      - key: BACKUP_DIR
        value: /var/acctapp/backups
      - key: PAYMENT_PROVIDER
        value: test          # replace with a real gateway before charging customers
      - key: METRICS_TOKEN
        generateValue: true
